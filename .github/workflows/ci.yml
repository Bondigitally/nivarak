name: CI — Tests

on:
  push:
    branches: [main, develop]
  # Run on all PRs (including stacked branches) — not just those targeting main.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Dummy values for unit tests — no real DB connection is made
  DATABASE_URL: "postgresql://test:test@localhost:5432/test"
  JWT_ACCESS_SECRET: "ci-test-access-secret-do-not-use-in-prod"
  JWT_REFRESH_SECRET: "ci-test-refresh-secret-do-not-use-in-prod"

jobs:
  test:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run full test suite
        run: npm test

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck
